name: Crop scan

# Runs the satellite worker (ADR 0026): every 3 hours, or by hand from the
# Actions tab ("Run workflow"). Scheduled runs use the default branch.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crop-scan
  cancel-in-progress: false

jobs:
  scan:
    name: Scan fields for new Sentinel-2 passes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Secrets: the crop_worker database URL (session pooler) and the
      # Storage S3 access key. Variables: the Storage S3 endpoint and region.
      WORKER_DATABASE_URL: ${{ secrets.WORKER_DATABASE_URL }}
      STORAGE_S3_ACCESS_KEY_ID: ${{ secrets.STORAGE_S3_ACCESS_KEY_ID }}
      STORAGE_S3_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_S3_SECRET_ACCESS_KEY }}
      STORAGE_S3_ENDPOINT: ${{ vars.STORAGE_S3_ENDPOINT }}
      STORAGE_S3_REGION: ${{ vars.STORAGE_S3_REGION }}
    steps:
      - name: Skip until the worker is configured
        if: env.WORKER_DATABASE_URL == ''
        run: echo "::notice::Crop scan secrets are not set yet; skipping."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.WORKER_DATABASE_URL != ''
      - name: Build the worker image
        if: env.WORKER_DATABASE_URL != ''
        run: docker build -t agri-worker services/worker
      - name: Run one scan
        if: env.WORKER_DATABASE_URL != ''
        run: >-
          docker run --rm
          -e WORKER_DATABASE_URL -e STORAGE_S3_ENDPOINT -e STORAGE_S3_REGION
          -e STORAGE_S3_ACCESS_KEY_ID -e STORAGE_S3_SECRET_ACCESS_KEY
          agri-worker
