[project]
name = "agri-worker"
version = "0.1.0"
description = "AgriAsaan satellite worker: Sentinel-2 crop health per field (ADR 0026)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3>=1.35",
  "numpy>=2.1",
  "psycopg[binary]>=3.2",
  "pyproj>=3.7",
  "pystac-client>=0.8",
  "rasterio>=1.4",
  "shapely>=2.0",
]

[dependency-groups]
dev = [
  "boto3-stubs[s3]>=1.35",
  "mypy>=1.13",
  "pytest>=8.3",
  "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
strict = true

[[tool.mypy.overrides]]
module = ["rasterio.*", "pystac_client.*", "pystac.*", "shapely.*", "pyproj.*"]
ignore_missing_imports = true
